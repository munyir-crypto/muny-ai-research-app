<!DOCTYPE html>
<html>
<head>
  <title>AI NVivo Research Platform</title>
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
</head>
<body>

<h2>AI Qualitative Research Platform</h2>

<textarea id="input" rows="10" cols="80"></textarea>
<br><br>

<button onclick="analyze()">Analyze</button>

<pre id="output"></pre>

<div id="graph" style="width:600px;height:400px;border:1px solid black;"></div>

<script>
async function analyze() {
  const text = document.getElementById("input").value;

  const response = await fetch("https://your-app.onrender.com/analyze", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({text})
  });

  const data = await response.json();
  document.getElementById("output").innerText = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
